<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laminator</title></head><body>
<script src="core.js"></script>
<script>
/* Laminator pouch A4 di meja toko fotokopi, untuk game Fotokopi Kilat on Monad.
   x = depth 26 (front x = W, the exit), y = width 44 (+y = viewer-left; power switch on the RIGHT side y = 0), z = up.
   Stands on a desk board (top at Z0). The pouch travels along +x: in at the back slot, out at the front slot.

   How a real pouch laminator works (each button is one real step):
     1. Switch on: the heating shoes above and below the path warm up; the POWER light is red, READY turns green when
        the thermostat reaches the set temperature (80 mic ~ 110 C, 125 mic ~ 130 C).
     2. Set the dial to the pouch thickness. A thick pouch run on the thin setting stays cloudy and wavy.
     3. Feed the pouch fold first into the back slot: the motor turns, through its gear train, two pairs of silicone
        rollers that pull the pouch past the hot shoes, melting the glue and pressing the film flat; it comes out the front.
     4. ABS (anti-jam) reverses the motor and backs the pouch out of the rear slot.

   Parts (each held by another):
     CASE      desk board . body . back input guide . front output tray . back + front slots . top: label, POWER and
               READY lights, thickness dial, ABS key . right side: rocker switch . power cord
     TRANSPORT 2 upper + 2 lower silicone rollers on shafts . gear on each roller shaft . idler gear . motor + pinion
     HEAT      upper + lower heating shoes . thermostat . control board . wires
*/
PALS.monad = { l:'#a99bfa', m:'#836ef9', d:'#2a2163' };

const Z0 = 3, W = 26, D = 44, H = 9, ZP = Z0 + 4.5;               // desk top, body size, pouch path height
const BODY = rrUV(0, Z0, D, Z0 + H, 4);
const POUCH = { y0:11, y1:33, len:31 }, ROLLX = [10, 18];
const GREY = matOf('#ebe7dc'), LIGHT = matOf('#f6f4ec'), RECESS = '#2b2523', PAPER = '#fbfaf3';
const SILI = matOf('#e0773a'), PCBM = matOf('#2f8a5a'), HOT = '#ff6a2a';
const DOCS = [
  { name:'Ijazah S1', mic:125, kind:'ijazah' },
  { name:'KTP', mic:80, kind:'ktp' },
  { name:'Menu warung', mic:125, kind:'menu' } ];
const TEMP = { 80:110, 125:130 };

const lClamp = (v, a, b) => Math.max(a, Math.min(b, v));
function lHexa(c, m, shade = tone, w = .9){
  const F = [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]], ctr = avg(c);
  let s = '';
  for (const ix of F){ const q = ix.map(i => c[i]); let n = norm(cross(sub(q[1], q[0]), sub(q[2], q[0])));
    if (dot(n, sub(avg(q), ctr)) < 0) n = n.map(v => -v);
    if (vis(n)) s += shape(q, shade(n, m), w); }
  return s;
}
const slab = (x0, y0, x1, y1, z0, z1, m, w = .8) => lHexa([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], m, tone, w);

/* ---------- the pouch: film + document; the part past the rollers is laminated ---------- */
// lead = x of the front (fold) edge; draws only the part of the pouch between xa and xb
function pouchPiece(st, xa, xb, z = ZP){
  const x0 = Math.max(st.px - POUCH.len, xa), x1 = Math.min(st.px, xb);
  if (x1 - x0 < .05 || st.pphase === 'none') return '';
  const doc = DOCS[st.doc], piece = [[x0, POUCH.y0, z], [x1, POUCH.y0, z], [x1, POUCH.y1, z], [x0, POUCH.y1, z]];
  const lx = st.px - POUCH.len;                                          // tail x
  const d = (u, v) => [lx + u, POUCH.y1 - v, z + .04];                    // pouch-local: u from the tail, v from the left edge
  let inner = fill(pd(on(PZ(z + .02), rectUV(lx + 1.2, POUCH.y0 + 1.2, st.px - 1.2, POUCH.y1 - 1.2))), PAPER);
  if (doc.kind === 'ijazah'){
    inner += `<path d="${pd([d(25, 4), d(25, 18)], false)}" stroke="${INK}" stroke-width=".7" fill="none"/>`;
    for (const u of [20, 17.5, 15]) inner += `<path d="${pd([d(u, 5), d(u, 17)], false)}" stroke="#7d7169" stroke-width=".4" fill="none"/>`;
    inner += fill(pd(on(PZ(z + .05), ellUV(lx + 7, POUCH.y1 - 15, 2.4, 2.4, 16))), '#f4b829') + ink(pd(on(PZ(z + .06), ellUV(lx + 7, POUCH.y1 - 15, 2.4, 2.4, 16))), .4);
  } else if (doc.kind === 'ktp'){
    inner += fill(pd(on(PZ(z + .04), rectUV(lx + 9, POUCH.y0 + 4, lx + 22, POUCH.y1 - 4))), '#9fd0ec');
    inner += fill(pd(on(PZ(z + .05), rectUV(lx + 11, POUCH.y0 + 5.5, lx + 17, POUCH.y0 + 10))), '#f2efe7');
    for (const u of [19, 16, 13]) inner += `<path d="${pd([d(u, 4.5), d(u, 11)], false)}" stroke="${INK}" stroke-width=".35" fill="none"/>`;
  } else {
    inner += `<path d="${pd([d(26, 6), d(26, 16)], false)}" stroke="#cf5038" stroke-width="1" fill="none"/>`;
    for (let u = 22; u > 5; u -= 2.6) inner += `<path d="${pd([d(u, 4), d(u, 13)], false)}" stroke="#7d7169" stroke-width=".35" fill="none"/><path d="${pd([d(u, 15.5), d(u, 18)], false)}" stroke="${INK}" stroke-width=".35" fill="none"/>`;
  }
  // laminated part: shine, or cloud + bubbles when the dial was too low for the pouch
  const passX = ROLLX[1];
  let film = fill(pd(piece), '#dff1f4', 'opacity=".55"');
  if (st.pphase === 'feed' || st.pphase === 'out'){ const la = Math.max(x0, lx), lb = Math.min(x1, st.pphase === 'out' ? st.px : passX);
    if (lb > la){ const good = doc.mic <= st.setMic;
      const lam = [[la, POUCH.y0, z + .1], [lb, POUCH.y0, z + .1], [lb, POUCH.y1, z + .1], [la, POUCH.y1, z + .1]];
      if (good){ film += fill(pd(lam), '#ffffff', 'opacity=".18"');
        for (const u of [6, 14, 23]){ const xs = lx + u; if (xs > la && xs + 3 < lb) film += fill(pd([[xs, POUCH.y0 + 2, z + .12], [xs + 2, POUCH.y0 + 2, z + .12], [xs + 5, POUCH.y1 - 2, z + .12], [xs + 3, POUCH.y1 - 2, z + .12]]), '#ffffff', 'opacity=".55"'); } }
      else { film += fill(pd(lam), '#e6e6e0', 'opacity=".45"');
        for (const [u, v, r] of [[5, 6, 1.2], [9, 15, .8], [14, 9, 1.4], [19, 17, .9], [24, 7, 1.1], [27, 14, .7]]){ const xs = lx + u;
          if (xs > la && xs < lb) film += ink(pd(on(PZ(z + .14), ellUV(xs, POUCH.y1 - v, r, r, 10))), .4); } } } }
  return clipTo(piece, inner) + film + ink(pd(piece), .8);
}

/* ---------- the closed laminator ---------- */
function bodySvg(st, m){
  const FRONT = facing([1,0,0]), BACK = facing([-1,0,0]), RIGHT = facing([0,-1,0]), TOP = facing([0,0,1]);
  let s = '';
  if (BACK) s += fill(pd(on(PX(0), BODY)), tone([-1,0,0], m)) + shape(on(PX(-.1), rrUV(6, ZP - .7, 38, ZP + .7, .5)), RECESS, .9);
  s += extrude(BODY, 0, W, m);
  if (FRONT) s += fill(pd(on(PX(W), BODY)), tone([1,0,0], m)) + shape(on(PX(W + .1), rrUV(6, ZP - .7, 38, ZP + .7, .5)), RECESS, .9);
  if (TOP){ const zt = Z0 + H + .05;
    s += shape(on(PZ(zt), rrUV(3, 6, W - 3, 38, 3)), mix(m.l, '#ffffff', .3), .8);
    s += `<text transform="${txM(P(9, 22, zt + .02), Dv(0,-1,0), Dv(1,0,0))}" font-size="2.6" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".08em">LAMINATOR A4</text>`;
    const red = st.on, green = st.on && st.heat >= 1, blinkG = st.on && st.heat < 1 && Math.floor(st.t*3) % 2 === 0;
    s += shape(on(PZ(zt + .02), ellUV(W - 6, 9, .9, .9, 10)), red ? '#e2483d' : '#7d7169', .4);
    s += shape(on(PZ(zt + .02), ellUV(W - 6, 13, .9, .9, 10)), green ? '#43c25c' : blinkG ? '#2f6b40' : '#7d7169', .4);
    for (const [y, lab] of [[9, 'POWER'], [13, 'READY']]) s += `<text transform="${txM(P(W - 3.6, y, zt + .02), Dv(0,-1,0), Dv(1,0,0))}" font-size="1.1" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${lab}</text>`;
    for (const [y, lab] of [[19.6, '80'], [24.4, '125']]) s += `<text transform="${txM(P(W - 2.6, y, zt + .02), Dv(0,-1,0), Dv(1,0,0))}" font-size="1.1" fill="${INK}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${lab}</text>`;
  }
  if (RIGHT){ const ry = -.15;                                           // rocker switch: the pressed half sits deeper
    s += shape(on(PY(ry), rrUV(8, Z0 + 2.5, 13, Z0 + 6.5, .6)), RECESS, .8);
    const onSide = st.on ? [8.4, 10.5] : [10.5, 12.6];
    s += act('rocker', shape(on(PY(ry - .4), rectUV(8.4, Z0 + 2.9, 12.6, Z0 + 6.1)), '#3d3935', .5)
       + shape(on(PY(ry - .8), rectUV(onSide[0], Z0 + 2.9, onSide[1], Z0 + 6.1)), st.on ? '#e2483d' : '#55504a', .5)); }
  if (FRONT) s += ink(pd(on(PX(W), BODY)), 2.2);
  if (BACK) s += ink(pd(on(PX(0), BODY)), 2.2);
  return s + hullInk([...on(PX(0), BODY), ...on(PX(W), BODY)], 2.8);
}
function controlsSvg(st){
  const zt = Z0 + H, a = (st.dialA - 90) * Math.PI/180, k = st.absk > 0 ? .5 : 0;
  let dial = cyl(W - 7, 22, zt, zt + 1.4, 2.2, LIGHT, toneI, .9, 20);
  if (facing([0,0,1])) dial += ink(pd([[W - 7, 22, zt + 1.45], [W - 7 + 1.8*Math.cos(a), 22 + 1.8*Math.sin(a), zt + 1.45]], false), .9);
  let abs = cyl(W - 7, 31, zt, zt + 1 - k, 1.5, DARK, toneI, .8, 16);
  if (facing([0,0,1])) abs += `<text transform="${txM(P(W - 7, 31, zt + 1.05 - k), Dv(0,-1,0), Dv(1,0,0))}" font-size="1" fill="#f2efe7" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">ABS</text>`;
  return byDepth([{ box:[[W - 9.2, 19.8, zt], [W - 4.8, 24.2, zt + 1.5]], svg: act('dial', dial) }, { box:[[W - 8.5, 29.5, zt], [W - 5.5, 32.5, zt + 1]], svg: act('abs', abs) }]);
}

function rearSvg(st){
  let s = slab(-15, 9, .3, 35, ZP - 1, ZP - .6, LIGHT, .8);
  s += act('pouch', pouchPiece(st, -1e9, 0, ZP));
  return { box:[[-15 - (POUCH.len - 15), 8, ZP - 1], [0, 36, ZP + .3]], svg: s };
}
function frontSvg(st){
  let s = slab(W - .3, 9, W + 12, 35, ZP - 1, ZP - .6, LIGHT, .8);
  s += act('pouch', pouchPiece(st, W, 1e9, ZP));
  return { box:[[W, 8, ZP - 1], [W + POUCH.len + 2, 36, ZP + .3]], svg: s };
}
function cordSvg(){
  const pts = [[-.5, 40, Z0 + 2], [-5, 40.5, Z0 + .6], [-12, 42, Z0 + .6], [-18, 40, Z0 + .6]];
  return { box:[[-18.5, 39, Z0], [0, 43, Z0 + 2.5]], svg: `<path d="${pd(pts, false)}" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="${pd(pts, false)}" fill="none" stroke="#46413c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>` };
}

/* ---------- see-through ---------- */
let MECH_LABELS = '';
const lWire = (pts, col) => ({ box:[[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - .5), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + .5)],
  svg:`<path d="${pd(pts, false)}" fill="none" stroke="${INK}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><path d="${pd(pts, false)}" fill="none" stroke="${col}" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round"/>` });
function gear(x, z, r, ang, m){                                          // a thin gear on the right end (axis along y)
  let s = rod([x, 2.6, z], [x, 4, z], r, m, toneI, .7, r, 20);
  if (facing([0,-1,0])) for (let i = 0; i < 3; i++){ const a = ang + i*2*Math.PI/3;
    s += ink(pd([[x, 2.55, z], [x + r*.8*Math.cos(a), 2.55, z + r*.8*Math.sin(a)]], false), .5); }
  return { box:[[x - r, 2.6, z - r], [x + r, 4, z + r]], svg: s };
}
function mech(st, k){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg });
  const bx = (x0,y0,z0,x1,y1,z1,mm,w = .7) => put([[x0,y0,z0],[x1,y1,z1]], box(x0,y0,z0,x1,y1,z1,mm,toneI,w));
  const run = st.pphase === 'feed' || st.pphase === 'reverse', h = st.heat, ra = st.rot * Math.PI/180;
  // heating shoes before the rollers, above and below the path
  for (const [z0, z1] of [[ZP + .6, ZP + 1.6], [ZP - 1.6, ZP - .6]])
    put([[3, 6, z0], [8, 38, z1]], box(3, 6, z0, 8, 38, z1, matOf(mix('#8f989b', HOT, h)), toneI, .7));
  // silicone rollers: two pairs, upper and lower, on shafts reaching the gears at the right end
  for (const x of ROLLX) for (const [z, dir] of [[ZP + 1.2, -1], [ZP - 1.2, 1]]){
    put([[x - 1.1, 4, z - 1.1], [x + 1.1, 38, z + 1.1]], rod([x, 6, z], [x, 38, z], 1.1, SILI, toneI, .7)
      + rod([x, 4, z], [x, 6, z], .4, METAL, toneI, .4)
      + (facing([0,1,0]) ? ink(pd([[x, 38.05, z], [x + Math.cos(ra*dir), 38.05, z + Math.sin(ra*dir)]], false), .6) : ''));
    parts.push(gear(x, z, 1.15, ra*dir, METAL)); }
  parts.push(gear(14, ZP - 2.8, 1.4, -ra*1.2, matOf('#c9cfd2')));          // idler gear between the pairs
  bx(19, 1, Z0 + .5, 24, 6, Z0 + 3.6, DARK, .8);                              // motor
  put([[19, 2, Z0 + 1.2], [19.2, 4, Z0 + 3]], gear(19, Z0 + 2, .7, ra*2, METAL).svg);
  bx(4.5, 39, ZP + 1.8, 7.5, 41, ZP + 3, matOf('#5c6369'), .5);              // thermostat on the upper shoe
  bx(3, 36, Z0 + .5, 14, 43, Z0 + 1.3, PCBM, .6);                             // control board
  for (const [x, y] of [[5, 38], [9, 40]]) bx(x, y, Z0 + 1.3, x + 2.4, y + 2, Z0 + 2, DARK, .3);
  parts.push(lWire([[1, 40, Z0 + 2], [3, 40, Z0 + 1.3]], '#46413c'));
  parts.push(lWire([[12, 37, Z0 + 1.3], [12, 37, ZP - 1.6], [7, 37, ZP - 1.6]], h > .05 ? '#ff6a2a' : '#3a3632'));
  parts.push(lWire([[13, 39, Z0 + 1.3], [13, 39, ZP + 2.2], [7.5, 40, ZP + 2.2]], h > .05 ? '#ff6a2a' : '#3a3632'));
  parts.push(lWire([[14, 38, Z0 + 1.3], [21, 6, Z0 + 3.6]], '#e2483d'));
  const inner = pouchPiece(st, 0, W, ZP);
  if (inner) put([[Math.max(0, st.px - POUCH.len), POUCH.y0, ZP - .1], [Math.min(W, st.px), POUCH.y1, ZP + .2]], inner);
  const out = byDepth(parts);
  MECH_LABELS = k <= .6 ? '' : xrCallouts([
    { at:[ROLLX[0], 30, ZP + 2.3], text:'ROL SILIKON', on: run },
    { at:[5.5, 20, ZP + 1.6], text:'PEMANAS', on: h > .1 },
    { at:[14, 2.6, ZP - 2.8], text:'RODA GIGI', on: run },
    { at:[21.5, 1, Z0 + 3.6], text:'MOTOR', on: run },
    { at:[6, 40, ZP + 3], text:'TERMOSTAT', on: st.on && h < 1 },
    { at:[8.5, 43, Z0 + 1.3], text:'PAPAN KONTROL', on: st.on } ], [0, W, 0, D, Z0, Z0 + H + 2]);
  return out;
}

/* ---------- scene ---------- */
function scene(st, m){
  let s = board(-20, -8, W + 16, D + 6, Z0, 6, WOOD);
  const bt = boardTop(-20, -8, W + 16, D + 6, Z0, 6);
  s += castShadow([...on(PX(0), BODY), ...on(PX(W), BODY)], Z0, bt);
  const k = ease(st.xr || 0);
  let body = bodySvg(st, m);
  if (k > 0) body = xrGhost(body, '', k, BODY, 0, W, m) + `<g opacity="${f(k)}">${mech(st, k)}</g>`;
  body += controlsSvg(st);
  s += byDepth([{ box:[[0, -1, Z0], [W, D, Z0 + H + 1.5]], svg: body }, rearSvg(st), frontSvg(st), cordSvg()]);
  if (k > .6) s += MECH_LABELS;
  else s += [
    tag([W - 6, 13, Z0 + H], 20, -12, 'READY', st.heat >= 1 && st.on),
    tag([W - 7, 22, Z0 + H + 1.4], 22, -2, `${st.setMic} MIC`, false),
    tag([-6, 22, ZP], -22, 8, 'MASUK', st.pphase === 'ready'),
  ].join('');
  return s;
}

/* ---------- behaviour ---------- */
let ui, lLoop = false;
const temp = st => Math.round(25 + (TEMP[st.setMic] - 25) * st.heat);
function lStep(st, dt){
  st.t += dt; st.absk = Math.max(0, st.absk - dt);
  st.dialA += lClamp((st.setMic === 80 ? 40 : 140) - st.dialA, -dt*300, dt*300);
  st.heat = st.on ? Math.min(1, st.heat + dt/3.5) : Math.max(0, st.heat - dt/6);
  if (st.queued && st.on && st.heat >= 1 && st.pphase === 'ready'){ st.queued = false; st.pphase = 'feed'; }
  if (st.pphase === 'feed'){
    if (st.on && st.heat >= .97){ st.px += dt*7; st.rot = (st.rot + dt*360) % 360; }
    if (st.px - POUCH.len > W + .5){ st.pphase = 'out';
      const good = DOCS[st.doc].mic <= st.setMic;
      ui.flash(good ? 'Mengilap! Laminating rapi' : 'Bergelombang: ketebalan dial terlalu rendah', 2200); }
  } else if (st.pphase === 'reverse'){
    st.px -= dt*7; st.rot = (st.rot - dt*360 + 360) % 360;
    if (st.px <= -.5){ st.px = -.5; st.pphase = 'ready'; ui.flash('Pouch keluar lewat belakang', 1600); }
  }
  if (st.newAt > 0){ st.newAt -= dt; if (st.newAt <= 0){ st.newAt = 0; st.pphase = 'ready'; st.px = -.5; } }
}
function lRun(){
  if (lLoop) return; lLoop = true;
  ui.animate(dt => { const st = ui.st; lStep(st, dt);
    const moving = st.pphase === 'feed' || st.pphase === 'reverse' || (st.on && st.heat < 1) || (!st.on && st.heat > 0) || st.absk > 0
      || Math.abs(st.dialA - (st.setMic === 80 ? 40 : 140)) > .5 || st.newAt > 0 || st.queued;
    if (!moving) lLoop = false; return moving; });
}
function power(st){ st.on = !st.on; if (!st.on) st.queued = false; lRun(); }
function setMic(st, v){ if (st.pphase === 'feed') return ui.flash('Atur dial sebelum memasukkan pouch'); if (v > st.setMic) st.heat = Math.min(st.heat, .8); st.setMic = v; lRun(); }
function feed(st){
  if (st.pphase === 'feed' || st.pphase === 'reverse') return ui.flash('Pouch sedang berjalan');
  if (st.pphase === 'out') return ui.flash('Ambil hasilnya dulu');
  if (!st.on){ power(st); st.queued = true; return ui.flash('Laminator dinyalakan: pouch masuk otomatis saat READY'); }
  if (st.heat < 1){ st.queued = true; lRun(); return ui.flash(`Masih memanas (${temp(st)} C): pouch masuk otomatis saat READY`); }
  st.pphase = 'feed'; lRun();
}
function abs(st){
  st.absk = .2; lRun();
  if (st.pphase !== 'feed' || st.px <= 0) return ui.flash('ABS: tidak ada pouch di dalam');
  st.pphase = 'reverse';
}
function pickDoc(st, i){ if (st.pphase !== 'ready') return ui.flash('Ganti dokumen saat pouch belum masuk'); st.doc = i; }
function take(st){
  if (st.pphase !== 'out') return ui.flash('Belum ada hasil');
  if (DOCS[st.doc].mic <= st.setMic) st.done++; else st.bad++;
  st.pphase = 'none'; st.newAt = .8; lRun();
}

ui = mountFigure({
  fig:'03', turn:'full', title:'Laminator', hint:'Nyalakan · atur dial · masukkan pouch',
  idea:'Dua pasang rol silikon menarik pouch melewati pemanas: lemnya meleleh dan plastiknya ditekan rata.',
  size:[W + 50, D + 14, 24], center:[4, D/2 - 1], palette:'monad',
  state:{ on:false, heat:0, setMic:80, dialA:40, doc:0, px:-.5, pphase:'ready', rot:0, t:0, absk:0, done:0, bad:0, newAt:0, queued:false },
  scene,
  stats: st => [{ label:'SUHU', value: `${temp(st)} C` }, { label:'RAPI', value: st.done, small:true }, { label:'GAGAL', value: st.bad, small:true }],
  readout: st => !st.on ? 'mati · nyalakan dulu'
    : st.heat < 1 ? `memanas ${temp(st)} C…`
    : st.pphase === 'feed' ? 'rol menarik pouch…' : st.pphase === 'reverse' ? 'ABS: pouch mundur…'
    : st.pphase === 'out' ? 'selesai · ambil hasil' : `siap · ${DOCS[st.doc].name} (pouch ${DOCS[st.doc].mic} mic)`,
  buttons:[
    { label:'Nyalakan', onClick:(st) => power(st) },
    { label:'Ketebalan', choices: st => [80, 125].map(v => ({ label:`${v} mic`, current: st.setMic === v,
        disabled: st.pphase === 'feed', why:'atur sebelum memasukkan pouch', onClick:(st) => setMic(st, v) })) },
    { label:'Dokumen', choices: st => DOCS.map((d, i) => ({ label:`${d.name} (${d.mic})`, current: st.doc === i,
        disabled: st.pphase !== 'ready', why:'ganti saat pouch belum masuk', onClick:(st) => pickDoc(st, i) })) },
    { label:'Masukkan pouch', onClick:(st) => feed(st) },
    { label:'ABS (mundur)', onClick:(st) => abs(st) },
    { label:'Ambil hasil', onClick:(st) => take(st) },
  ],
  acts:{ rocker:(st) => power(st), dial:(st) => setMic(st, st.setMic === 80 ? 125 : 80), abs:(st) => abs(st), pouch:(st) => st.pphase === 'out' ? take(st) : feed(st) },
  params:(st, q) => {
    if (q.get('on') === '1'){ st.on = true; st.heat = 1; }
    for (const key of ['heat', 'px', 'doc', 'rot']) if (q.has(key)) st[key] = +q.get(key);
    if (q.has('mic')){ st.setMic = +q.get('mic'); st.dialA = st.setMic === 80 ? 40 : 140; }
    if (q.has('pphase')) st.pphase = q.get('pphase');
  },
});
addEventListener('keydown', e => {
  if (/input|textarea|button/i.test(e.target.tagName)) return;
  const key = e.key.toLowerCase(), st = ui.st;
  if (key === ' ' || key === 'enter') feed(st); else if (key === 'o') power(st); else if (key === 'a') abs(st); else if (key === 't') take(st); else return;
  e.preventDefault(); ui.render();
});
xrMount(() => ui, () => '');
</script></body></html>
